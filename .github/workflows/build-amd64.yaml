name: build-amd64

permissions:
  contents: read

on:
  pull_request:
    branches: [master]
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
      - '[0-9]+.[0-9]+.[0-9]+-*'

env:
  CARGO_TERM_COLOR: always
  GHCR_IMAGE: ghcr.io/${{ github.repository }}

jobs:

  version-check:
    name: Verify tag matches Cargo.toml version
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag prefix
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          GIT_TAG=${GITHUB_REF#refs/tags/}
          GIT_TAG=${GIT_TAG#v}
          if [[ "$GIT_TAG" != "$CARGO_VERSION" && "$GIT_TAG" != "$CARGO_VERSION"-* ]]; then
            echo "::error::Git tag '$GIT_TAG' does not match Cargo.toml version '$CARGO_VERSION' (expected exact or '$CARGO_VERSION-*')"
            exit 1
          fi
          echo "Tag '$GIT_TAG' matches Cargo.toml version '$CARGO_VERSION'"

  build:
    name: Build
    needs: version-check
    if: ${{ !cancelled() && (needs.version-check.result == 'success' || needs.version-check.result == 'skipped') }}
    runs-on: ubuntu-22.04
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Build
        run: cargo build --release --all-features

      - name: Publish Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-amd64
          path: |
            target/release/hbbr
            target/release/hbbs
            target/release/rustdesk-utils
          if-no-files-found: error

  docker:
    name: Docker push
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-linux-amd64
          path: docker-amd64/

      - name: Make binaries executable
        run: chmod -v a+x docker-amd64/hbbs docker-amd64/hbbr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        run: |
          T=${GITHUB_REF#refs/*/}
          M=${T%%.*}
          TAGS="${{ env.GHCR_IMAGE }}:${T}"
          if [[ "$T" != *-* ]]; then
            TAGS="${TAGS},${{ env.GHCR_IMAGE }}:${M},${{ env.GHCR_IMAGE }}:latest"
          fi
          echo "DOCKER_TAGS=$TAGS" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: "./docker-amd64"
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.DOCKER_TAGS }}
